interface:
  display_name: "SDD Epic Update"
  short_description: "Reconcile Epic truth to one exact candidate"
  default_prompt: "Use $sdd-epic-update through its public directly callable or Apply-composed contract to reconcile repository-owned Epic, Story, Requirement, Scenario, implementation-map, gap, and verification-map truth against the supplied exact candidate, validate the result, report semantic closure across each affected Story's index, body states, maps, and gaps plus a complete Scenario Evidence Closure table with exact Scenario-set equality, claimed and proven boundary, opened cited proof, evidence type, durability or reproduction reference, result, and machine-stable gap classification (`none`, `required`, `optional-confidence:<reference>`, `manual-acceptance`, or `user-accepted:YYYY-MM-DD`) with matching unique canonical Epic Verification Gap markers and anchored passing proof also recorded in Verified By; classify every behavior-bearing changed source/test candidate, reject temporary, generic, placeholder, missing, or unanchored evidence and conclusion-leading caller claims, never relabel required technical proof as manual acceptance; prove same-candidate idempotence, and stop before code review, code fixes, Change lifecycle mutation, changelog work, or commits."
