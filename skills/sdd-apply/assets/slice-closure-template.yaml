# Generated after a durable final slice Review and a content-preserving local commit.
# Detailed gate, Scenario, visual, command, and evidence reasoning belongs in slice-reviews/<slice-id>.md.
schema: sdd-slice-closure-v2
change: <change-id>
slice: S1
repository: <repository-id>
updated: yyyy-mm-dd
review:
  path: slice-reviews/S1.md
  candidate: <canonical-candidate-watermark>
  verdict: ready
  sha256: <64-character-review-file-sha256>
scenarios:
  - scenario: EPIC-ID/S1 R1-S1
    result: pass
    gap: none
    reviewAnchor: scenario-epic-id-s1-r1-s1
visual:
  applicability: not-applicable
  reason: <exact Not applicable reason from tasks.md>
  requirements: []
# For applicability: required, set reason: null and add one compact row per declared V# obligation:
# requirements:
#   - requirement: V1
#     result: pass
#     gap: none
#     reviewAnchor: visual-v1
seal:
  finalCommit: <40-character-final-commit-sha>
  reviewedTree: <40-character-reviewed-staged-tree-sha>
  finalCommitTree: <40-character-final-tree-sha>
