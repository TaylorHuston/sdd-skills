interface:
  display_name: "SDD Apply"
  short_description: "Deliver one reviewed and reconciled Change slice"
  default_prompt: "Use $sdd-apply to deliver exactly one next-ready or explicitly named Requirement slice. Load governing repository guidance, establish the exact candidate, implement inline or through one optional safely isolated fresh-context worker, and run fresh Requirement/Scenario verification. Then compose the public candidate-bound $sdd-review contract in implementation-phase slice-checkpoint mode, perform at most one bounded remediation and scoped re-review, compose $sdd-epic-update, and run post-Epic slice Review when Epic files changed before marking the slice done. Keep Review and Epic Update independently callable, and stop before another slice, final Change-wide review, changelog, commits, release, deployment, or closeout."
