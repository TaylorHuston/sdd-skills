interface:
  display_name: "SDD Apply"
  short_description: "Select and implement one Change slice"
  default_prompt: "Use $sdd-apply to select the next ready Requirement slice from a planned or in-progress central Change, or the explicit slice I name. Tell me what behavioral outcome to implement, read applicable workspace and repository AGENTS.md guidance for how the repository expects work to proceed, check branch-policy compliance, and warn before implementation if the current branch is wrong. Apply only that slice and leave review, commits, Epic/changelog reconciliation, release, and closeout to their owning workflows."
