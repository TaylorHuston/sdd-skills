interface:
  display_name: "SDD Apply"
  short_description: "Deliver one reviewed and reconciled Requirement slice"
  default_prompt: "Use $sdd-apply to deliver exactly one next-ready or explicitly named atomic Requirement slice. Load governing guidance, establish the exact candidate, state a transient Scenario proof sketch, implement inline or through one optional safely isolated fresh-context worker, and run fresh verification. Compose $sdd-review in discovery slice-checkpoint mode; admit required findings only for explicit contract, material safety, project policy, false closure, or deterministic-gate grounds; apply one consolidated remediation batch; then require one fresh final candidate-bound Review. A new pre-existing issue after remediation returns needs-user, while only a remediation-introduced regression receives one narrow correction. Compose $sdd-epic-update, rerun post-Epic Review when Epic truth changes, create one content-identical local commit, persist slice-reviews/S#.md, generate and validate a minimal sdd-slice-closure-v2 receipt with the Review digest and Git tree seal, record the full SHA, and only then mark the slice done. Keep legacy v1 receipts compatible and stop before another slice, final Change-wide review, changelog, push, PR, release, deployment, or closeout."
