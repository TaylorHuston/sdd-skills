interface:
  display_name: "SDD Review"
  short_description: "Independently review a slice or full Change"
  default_prompt: "Use $sdd-review through its public candidate-bound contract. For a completed slice, default to a seal audit that verifies durable Review/receipt provenance, exact sets, gap consistency, freshness, commit reachability, and tree equality; seek new semantic findings only when explicit deep re-review is requested. For an active --slice-checkpoint, independently derive the Requirement/Scenario expectations, inspect the exact candidate, and return exactly the 14 canonical gate rows plus exact Scenario and visual closure rows. Admit BLOCKING or REQUIRED findings only for an explicit accepted-contract violation, material safety, project policy, false closure, or deterministic-gate failure, and classify each as product-defect or closure-repair. Treat prior verdicts and proof claims as untrusted. Ready requires both review axes pass and no unresolved required technical gap. Persist final ready slice Reviews at slice-reviews/S#.md using sdd-slice-review-v1 so Apply can hash them from a minimal sdd-slice-closure-v2 receipt. Apart from that authorized central Review write, remain read-only and stop without repository remediation, lifecycle, commit, or closeout mutation."
