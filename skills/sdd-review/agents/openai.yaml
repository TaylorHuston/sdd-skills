interface:
  display_name: "SDD Review"
  short_description: "Independently review a slice or full Change"
  default_prompt: "Use $sdd-review through its public candidate-bound contract, directly with or without a Change. For --slice-checkpoint, independently review the named slice's Requirements/Scenarios plus the exact candidate's relevant quality, security, data, rendered-UI, and regression surface; in implementation phase, report expected stale affected Epic mappings as epic-update-required, and in post-epic phase require them current; remain read-only and report ready, changes-requested, or blocked without lifecycle or closeout work. Otherwise run the complete Change-wide local PR-style review across every targeted repository and gate integration readiness on all targets."
